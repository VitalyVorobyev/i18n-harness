name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: ${{ matrix.cmd.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - { name: "fmt",    run: "cargo fmt --all -- --check" }
          - { name: "clippy", run: "cargo clippy --workspace --all-targets -- -D warnings" }
          - { name: "test",   run: "cargo test --workspace --all-targets" }
          - { name: "doc",    run: "cargo doc --workspace --no-deps --document-private-items" }
    steps:
      # TODO: pin third-party actions to commit SHAs before any public release tag.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri build dependencies
        if: matrix.cmd.name != 'fmt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - name: ${{ matrix.cmd.name }}
        run: ${{ matrix.cmd.run }}
        env:
          RUSTDOCFLAGS: -D warnings

  ui:
    name: ui-${{ matrix.cmd.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - { name: "typecheck", run: "bun run typecheck" }
          - { name: "lint",      run: "bun run lint" }
          - { name: "build",     run: "bun run build" }
          - { name: "audit",     run: "bun audit --prod" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: ${{ matrix.cmd.name }}
        run: ${{ matrix.cmd.run }}
