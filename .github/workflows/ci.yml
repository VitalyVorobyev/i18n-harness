name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: ${{ matrix.cmd.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - { name: "fmt",    run: "cargo fmt --all -- --check" }
          - { name: "clippy", run: "cargo clippy --workspace --all-targets -- -D warnings" }
          - { name: "test",   run: "cargo test --workspace --all-targets" }
          - { name: "doc",    run: "cargo doc --workspace --no-deps --document-private-items" }
          # Backend features no workspace member enables by default.
          - { name: "backend-features", run: "cargo clippy -p i18n-harness-backend --all-targets --all-features -- -D warnings && cargo test -p i18n-harness-backend --all-features" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux Tauri build dependencies
        if: matrix.cmd.name != 'fmt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      # The desktop crate embeds ui/dist (custom-protocol is a default
      # feature); its build script runs `bun run build:web` to produce it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.cmd.name != 'fmt'
        with:
          bun-version: "1.3.x"
      - name: Install JS dependencies
        if: matrix.cmd.name != 'fmt'
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: ${{ matrix.cmd.name }}
        run: ${{ matrix.cmd.run }}
        env:
          RUSTDOCFLAGS: -D warnings

  ui:
    name: ui-${{ matrix.cmd.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - { name: "typecheck", run: "bun run typecheck" }
          - { name: "lint",      run: "bun run lint" }
          - { name: "format",    run: "bun run fmt:check" }
          - { name: "build",     run: "bun run build" }
          - { name: "audit",     run: "bun audit --prod" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.x"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: ${{ matrix.cmd.name }}
        run: ${{ matrix.cmd.run }}

  ui-test:
    name: ui-vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.x"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Run Vitest unit tests
        run: bun run test:run

  ui-e2e:
    name: ui-playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.x"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: bun run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
