[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/locales",
    "crates/gate",
    "crates/glossary",
    "crates/backend",
    "crates/catalog",
    "crates/adapter-qt",
    "crates/adapter-react",
    "crates/project",
    "crates/cli",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/VitalyVorobyev/i18n-harness"
authors = ["i18n-harness contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"

# Regex (locale inference, format sniffing)
regex = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Qt .ts adapter
quick-xml = "0.38"

# HTTP client (sync, no async runtime; used by the ollama backend).
# The `json` feature enables send_json / as_json helpers used by the
# ollama backend; it also activates ureq's own serde/serde_json deps, which
# is fine because those are already workspace deps with matching versions.
ureq = { version = "3", features = ["json"] }

# Cryptographic hash (resume-key file-content hash; metrics correlation).
sha2 = "0.10"

# Date/time formatting (used by ProjectPaths::new_tuning_bundle_dir).
time = { version = "0.3", features = ["formatting", "macros"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
insta = { version = "1", features = ["json"] }
proptest = "1"

# Internal crates
i18n-harness-core = { path = "crates/core", version = "0.1.0" }
i18n-harness-locales = { path = "crates/locales", version = "0.1.0" }
i18n-harness-gate = { path = "crates/gate", version = "0.1.0" }
i18n-harness-glossary = { path = "crates/glossary", version = "0.1.0" }
i18n-harness-backend = { path = "crates/backend", version = "0.1.0" }
i18n-harness-catalog = { path = "crates/catalog", version = "0.1.0" }
i18n-harness-adapter-qt = { path = "crates/adapter-qt", version = "0.1.0" }
i18n-harness-adapter-react = { path = "crates/adapter-react", version = "0.1.0" }
i18n-harness-project = { path = "crates/project", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
