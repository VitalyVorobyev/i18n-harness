[package]
name = "i18n-harness-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Translation session: open catalogs, list and edit units, translate with progress and cancellation, save. Shared by the CLI and the desktop shell."

[lints]
workspace = true

[features]
default = ["ollama", "openai-compatible"]
ollama = ["i18n-harness-backend/ollama"]
openai-compatible = ["i18n-harness-backend/openai-compatible"]

[dependencies]
i18n-harness-core.workspace = true
i18n-harness-locales.workspace = true
i18n-harness-gate.workspace = true
i18n-harness-glossary.workspace = true
i18n-harness-backend.workspace = true
i18n-harness-formats.workspace = true
i18n-harness-project.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
