[package]
name = "i18n-harness-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TranslationBackend trait and backend implementations (manual, ollama, openai-compatible)."

[lints]
workspace = true

[features]
default = ["manual"]
manual = []
# `ollama` brings ureq (sync HTTP) + serde/serde_json for JSON encode/decode.
# `serde` and `serde_json` are already workspace deps used unconditionally by
# `TranslationOutcome`; they are not guarded here because removing them would
# break the outcome serialisation surface that the non-ollama build needs.
ollama = ["dep:ureq"]
# `openai-compatible` comes in M4.

[dependencies]
i18n-harness-core.workspace = true
i18n-harness-locales.workspace = true
i18n-harness-glossary.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
i18n-harness-adapter-qt.workspace = true
i18n-harness-gate.workspace = true
tempfile = "3"
