[package]
name = "i18n-harness-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TranslationBackend trait and backend implementations (manual, ollama, openai-compatible)."

[lints]
workspace = true

[features]
default = ["manual"]
manual = []
# `ollama` and `openai-compatible` features bring their HTTP/serde deps in
# M2 follow-up / M4 respectively. The trait surface stays stable across
# those additions because backends produce text only — adding HTTP transport
# does not change the trait method signature.

[dependencies]
i18n-harness-core.workspace = true
i18n-harness-locales.workspace = true
i18n-harness-glossary.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
i18n-harness-adapter-qt.workspace = true
i18n-harness-gate.workspace = true
