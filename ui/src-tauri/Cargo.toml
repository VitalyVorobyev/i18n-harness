[package]
name = "i18n-harness-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Tauri desktop shell for the i18n-harness."
authors.workspace = true
repository.workspace = true

[lib]
name = "i18n_harness_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `custom-protocol` makes the binary serve the embedded `ui/dist` bundle.
# Without it Tauri runs in dev mode and loads `devUrl`, so a plain
# `cargo build --release` would open a blank window. `bun tauri:dev`
# opts out with `--no-default-features` to keep the Vite dev server.
default = ["ollama", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Local Ollama servers. Without it the app edits catalogs but cannot
# translate with a model.
ollama = ["i18n-harness-session/ollama"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Kept on the minor version of `@tauri-apps/api` in package.json; the Tauri
# CLI refuses a build where the two differ.
tauri = { version = "~2.11", features = [] }
tauri-plugin-dialog = "~2.7"
# 2.6 and later need tauri 2.12.
tauri-plugin-opener = "~2.5"
serde = { workspace = true }
serde_json = { workspace = true }
i18n-harness-core = { workspace = true }
i18n-harness-locales = { workspace = true }
i18n-harness-backend = { workspace = true }
i18n-harness-session = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }


[lints]
workspace = true
