[package]
name = "i18n-harness-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Tauri desktop shell for the i18n-harness."
authors.workspace = true
repository.workspace = true

[lib]
name = "i18n_harness_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["ollama"]
# Gemma/Ollama HTTP backend. Enabled by default — without it the
# `translate_unit` command is unavailable and the UI falls back to
# manual editing only. The backend crate's `manual` feature is on
# unconditionally via its own defaults.
ollama = ["i18n-harness-backend/ollama"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
i18n-harness-core = { workspace = true }
i18n-harness-adapter-qt = { workspace = true }
i18n-harness-locales = { workspace = true }
i18n-harness-backend = { workspace = true }
i18n-harness-gate = { workspace = true }
i18n-harness-glossary = { workspace = true }
i18n-harness-project = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
